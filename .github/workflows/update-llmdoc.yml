# Reusable Workflow: Update LLMDoc
# 定时自动维护 llmdoc 项目文档，适用于任何包含 llmdoc 的仓库
name: Update LLMDoc (Reusable)

on:
  workflow_call:
    inputs:
      use_feishu_notify:
        description: "是否发送飞书通知"
        type: boolean
        default: true
      since_period:
        description: "检查变更的时间范围"
        type: string
        default: "24 hours ago"
      target_branch:
        description: "目标分支"
        type: string
        default: "dev"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ANTHROPIC_BASE_URL:
        required: false
      PAT_TOKEN:
        required: false
      FEISHU_WEBHOOK_TOKEN:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install pinned Claude Code CLI
        id: setup_claude
        run: |
          CLAUDE_INSTALL_DIR="$RUNNER_TEMP/claude-code-2.1.148"
          rm -rf "$CLAUDE_INSTALL_DIR"
          npm install --prefix "$CLAUDE_INSTALL_DIR" @anthropic-ai/claude-code@2.1.148
          CLAUDE_CODE_PATH="$CLAUDE_INSTALL_DIR/node_modules/.bin/claude"
          echo "path=$CLAUDE_CODE_PATH" >> $GITHUB_OUTPUT
          "$CLAUDE_CODE_PATH" --version

      - name: Update llmdoc with Claude
        id: update
        uses: anthropics/claude-code-action@e7b588b6eaa5263c2e7c6c7b34a29e190d32ee68
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
        with:
          github_token: ${{ secrets.PAT_TOKEN || github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.setup_claude.outputs.path }}
          prompt: |
            仓库: ${{ github.repository }}
            时间范围: ${{ inputs.since_period }}
            目标分支: ${{ inputs.target_branch }}

            执行 `update-llmdoc` skill，检查过去 ${{ inputs.since_period }} 内 ${{ inputs.target_branch }} 分支的代码变更，分析并更新 llmdoc 文档。

            完成后输出处理结果摘要。
          claude_args: |
            --model opus --allowedTools "Bash(git:*),Bash(gh:*),Bash(echo:*),Bash(date:*),Read,Write,Edit,Glob,Grep,Task,Skill"
            --json-schema '{"type":"object","properties":{"description":{"type":"string","description":"更新结果一句话摘要"},"total_files_updated":{"type":"number","description":"更新的文档文件总数"},"pr_url":{"type":"string","description":"创建的 PR 链接，无更新时为空字符串"}},"required":["description","total_files_updated","pr_url"]}'

      - name: Output Result
        if: always()
        id: parse
        env:
          STRUCTURED_OUTPUT: ${{ steps.update.outputs.structured_output }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 📚 llmdoc 更新结果" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$STRUCTURED_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          DESCRIPTION=$(echo "$STRUCTURED_OUTPUT" | jq -r '.description // "更新完成"' 2>/dev/null || echo "更新完成")
          TOTAL=$(echo "$STRUCTURED_OUTPUT" | jq -r '.total_files_updated // 0' 2>/dev/null || echo "0")
          PR_URL=$(echo "$STRUCTURED_OUTPUT" | jq -r '.pr_url // ""' 2>/dev/null || echo "")
          [ "$TOTAL" -gt 0 ] 2>/dev/null && STATUS="success" || STATUS="info"
          [ "$JOB_STATUS" != "success" ] && STATUS="warning" && DESCRIPTION="执行异常"

          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "title=llmdoc 文档更新" >> $GITHUB_OUTPUT
          echo "description=${DESCRIPTION}" >> $GITHUB_OUTPUT
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: Checkout Feishu Action
        if: always() && inputs.use_feishu_notify
        uses: actions/checkout@v5
        with:
          repository: Lightspeed-Intelligence/agentic-workflow-template
          ref: main
          token: ${{ secrets.PAT_TOKEN || github.token }}
          path: .agentic-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Notify Feishu
        if: always() && inputs.use_feishu_notify
        uses: ./.agentic-actions/.github/actions/feishu-notify
        with:
          webhook_token: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
          title: ${{ steps.parse.outputs.title }}
          description: ${{ steps.parse.outputs.description }}
          link_text: ${{ steps.parse.outputs.pr_url != '' && '🔗 查看 PR' || '🔗 查看详情' }}
          link_url: ${{ steps.parse.outputs.pr_url != '' && steps.parse.outputs.pr_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          status: ${{ steps.parse.outputs.status }}

    outputs:
      structured_output: ${{ steps.update.outputs.structured_output }}
