# 本仓库的 CI 配置 - 调用自身的 reusable workflows
name: CI

on:
  issues:
    types: [opened]  # 只监听 opened，避免 labeled 重复触发
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-review-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout contract tests
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test PR review contract
        run: python3 scripts/test-pr-review-contract.py

      - name: Test agentic workflow contracts
        run: python3 scripts/test-agentic-workflow-contract.py

      - name: Test private submodule auth contract
        run: python3 scripts/test-private-submodule-auth-contract.py

  issue-dispatch:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/issue-dispatch.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      SUBMODULE_SSH_KEY_BASE64: ${{ secrets.SUBMODULE_SSH_KEY_BASE64 }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true

  implement:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/implement.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      SUBMODULE_SSH_KEY_BASE64: ${{ secrets.SUBMODULE_SSH_KEY_BASE64 }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true

  question:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/question.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      SUBMODULE_SSH_KEY_BASE64: ${{ secrets.SUBMODULE_SSH_KEY_BASE64 }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true

  pr-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-review.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      SUBMODULE_SSH_KEY_BASE64: ${{ secrets.SUBMODULE_SSH_KEY_BASE64 }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true
