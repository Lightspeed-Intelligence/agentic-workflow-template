# Agentic CI：把本仓库的 Issue、评论和 PR 事件交给 agentic-workflow-template 的 reusable workflow。
# 可选输入（触发关键词、飞书通知、环境准备脚本等）见
# https://github.com/Lightspeed-Intelligence/agentic-workflow-template#配置项
#
# 每个 job 的 `!github.event.repository.is_template` 让带模板标记的仓库跳过这些调用：
# 模板仓库自身用单独的 workflow 调用本地版本。普通仓库里这个条件恒为真，可以保留。
name: Agentic CI

on:
  issues:
    types: [opened]  # 只监听 opened，避免 labeled 重复触发
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Issue 创建时自动分析；不会自动修复
  issue-dispatch:
    if: github.event_name == 'issues' && !github.event.repository.is_template
    permissions:
      contents: read
      issues: write
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/issue-dispatch.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}

  # 评论 /impl 或 ok 时实现代码
  implement:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null && !github.event.repository.is_template
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/implement.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}

  # 评论 /ask 或 /q 时回答问题
  question:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null && !github.event.repository.is_template
    permissions:
      contents: read
      issues: write
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/question.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}

  # PR 创建/更新时自动审查
  pr-review:
    if: github.event_name == 'pull_request' && !github.event.repository.is_template
    permissions:
      contents: read
      pull-requests: write
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/pr-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
