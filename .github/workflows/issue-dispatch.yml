# Reusable Workflow: Issue Dispatch
# 根据 Issue 标签自动分发到对应 Skill
name: Issue Dispatch (Reusable)

on:
  workflow_call:
    inputs:
      use_feishu_notify:
        description: "是否发送飞书通知"
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ANTHROPIC_BASE_URL:
        required: false
      PAT_TOKEN:
        required: false
      FEISHU_WEBHOOK_TOKEN:
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Install pinned Claude Code CLI
        id: setup_claude
        run: |
          CLAUDE_INSTALL_DIR="$RUNNER_TEMP/claude-code-2.1.148"
          rm -rf "$CLAUDE_INSTALL_DIR"
          npm install --prefix "$CLAUDE_INSTALL_DIR" @anthropic-ai/claude-code@2.1.148
          CLAUDE_CODE_PATH="$CLAUDE_INSTALL_DIR/node_modules/.bin/claude"
          echo "path=$CLAUDE_CODE_PATH" >> $GITHUB_OUTPUT
          "$CLAUDE_CODE_PATH" --version

      - name: Analyze Issue with Claude
        id: analyze
        uses: anthropics/claude-code-action@c0deb8ed7f234ce70586d54b0685c253f5407f72
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "Authorization: Bearer ${{ secrets.ANTHROPIC_API_KEY }}"
          DISABLE_AUTOUPDATER: "1"
        with:
          github_token: ${{ secrets.PAT_TOKEN || github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.setup_claude.outputs.path }}
          prompt: |
            仓库: ${{ github.repository }}
            仓库 URL: https://github.com/${{ github.repository }}

            根据 Issue 标签和内容，选择 `bug-analyze`、`feature-review` 或 `answer-question` skill 处理，并使用 `gh issue comment` 将分析结果发表到 Issue。

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}
            Body:
            ${{ github.event.issue.body }}

            完成分析后必须调用 `gh issue comment ${{ github.event.issue.number }} --body "..."` 发表评论。
            注意: 所有代码链接必须使用 https://github.com/${{ github.repository }}/blob/main/... 格式。
          claude_args: |
            --model claude-opus-4-8 --allowedTools "Bash(gh issue:*),Bash(gh pr:*),Bash(git:*),Read,Write,Edit,Glob,Grep,Task,Skill"
            --json-schema '{"type":"object","properties":{"description":{"type":"string","description":"执行结果的一句话摘要，用于通知"},"issue_type":{"type":"string","enum":["bug","feature","question"],"description":"Issue 类型"},"severity":{"type":"string","enum":["critical","high","medium","low","n/a"],"description":"Bug 严重程度"},"cost":{"type":"string","enum":["small","medium","large","extra-large","n/a"],"description":"需求预估成本"}},"required":["description","issue_type"]}'

      - name: Output Result
        if: always()
        run: |
          echo "## Issue Analysis Result" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.analyze.outputs.structured_output }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Parse Analysis Output
        if: always() && inputs.use_feishu_notify
        id: parse
        run: |
          STRUCTURED_OUTPUT='${{ steps.analyze.outputs.structured_output }}'

          if [ -n "$STRUCTURED_OUTPUT" ] && [ "$STRUCTURED_OUTPUT" != "null" ]; then
            DESCRIPTION=$(echo "$STRUCTURED_OUTPUT" | jq -r '.description // "无描述"')
            ISSUE_TYPE=$(echo "$STRUCTURED_OUTPUT" | jq -r '.issue_type // "unknown"')
            SEVERITY=$(echo "$STRUCTURED_OUTPUT" | jq -r '.severity // "n/a"')
            COST=$(echo "$STRUCTURED_OUTPUT" | jq -r '.cost // "n/a"')

            TITLE="Issue 分析: ${ISSUE_TYPE}"
            if [ "$ISSUE_TYPE" == "bug" ]; then
              TITLE="Bug 分析 - 严重程度: ${SEVERITY}"
              case "$SEVERITY" in
                "critical") STATUS="error" ;;
                "high") STATUS="warning" ;;
                *) STATUS="info" ;;
              esac
            elif [ "$ISSUE_TYPE" == "feature" ]; then
              TITLE="需求评审 - 成本: ${COST}"
              STATUS="info"
            else
              STATUS="info"
            fi
          else
            TITLE="Issue 分析失败"
            DESCRIPTION="未能获取结构化输出"
            STATUS="warning"
          fi

          if [ "${{ job.status }}" != "success" ]; then
            STATUS="warning"
            DESCRIPTION="GitHub Action 执行失败"
          fi

          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          # 多行输出使用 heredoc
          {
            echo 'description<<EOF'
            echo "**${{ github.repository }}** #${{ github.event.issue.number }}"
            echo "*${{ github.event.issue.title }}*"
            echo "${DESCRIPTION}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Checkout Action
        if: always() && inputs.use_feishu_notify
        uses: actions/checkout@v5
        with:
          repository: Lightspeed-Intelligence/agentic-workflow-template
          ref: main
          token: ${{ secrets.PAT_TOKEN || github.token }}
          path: .agentic-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Notify Feishu
        if: always() && inputs.use_feishu_notify
        continue-on-error: true # 通知失败不拖垮主 job，失败详情见步骤注解
        uses: ./.agentic-actions/.github/actions/feishu-notify
        with:
          webhook_token: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
          title: ${{ steps.parse.outputs.title }}
          description: ${{ steps.parse.outputs.description }}
          link_text: "🔗 查看 Issue"
          link_url: ${{ github.event.issue.html_url }}
          status: ${{ steps.parse.outputs.status }}

    outputs:
      structured_output: ${{ steps.analyze.outputs.structured_output }}
